<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <main class="container">

        <h1>Expense Tracker</h1>
        <section class="card">
            <div id="monthlySummary">
                Total this month: <strong id="monthlyTotal">0.00</strong>
            </div>
        </section>

        <section class="card">
            <form id="expense-form">
                <input type="date" name="date" required />
                <input type="text" name="description" placeholder="Description" required />
                <input type="number" name="amount" step="0.01" placeholder="Amount" required />
                <select id="currency" name="currency" required></select>
                <select id="category" name="category"></select>
                <label id="meal-type-wrapper" style="display:none;">
                    Meal type
                    <select id="meal-type-select">
                        <option value="">-</option>
                        <option value="breakfast">breakfast</option>
                        <option value="lunch">lunch</option>
                        <option value="dinner">dinner</option>
                    </select>
                </label>
                <button>Add Expense</button>
            </form>
        </section>

        <section class="card">
            <div>
                <button id="export-btn">Export CSV</button>
                <div id="monthSwitcher">
                    <button id="prevMonth">←</button>
                    <span id="currentMonth"></span>
                    <button id="nextMonth">→</button>
                </div>
            </div>
            <ul id="expense-list"></ul>
        </section>

        <section class="card">
            <h2>Categories</h2>
            <form id="category-form">
                <input name="category-name" placeholder="New category" required />
                <button>Add</button>
            </form>
            <ul id="category-list"></ul>
        </section>

    </main>

    <script type="module" src="app.js"></script>
</body>

</html>
